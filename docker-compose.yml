version: '3.8'

services:
  dload:
    image: ghcr.io/krabhi4/dload:latest
    container_name: dload
    ports:
      - "8080:8080"
    volumes:
      - ./downloads:/data
      - ./dload.db:/app/dload.db
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  downloads:
