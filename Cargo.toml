[package]
name = "dload"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A self-hosted download manager"
repository = "https://github.com/krabhi4/dload"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["multipart"] }
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
bcrypt = "0.19.3"
sha2 = "0.11.1"
hex = "0.4.3"
# jsonwebtoken 10 made the crypto backend pluggable; its default features
# enable no provider, so encode/decode panics at runtime. Pin the pure-Rust one.
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.21"
anyhow = "1.0.104"
base64 = "0.23.1"
content_disposition = "0.4"
url = "2.5.8"
urlencoding = "2.1.3"
regex = "1.13.1"
futures = "0.3.34"
tokio-util = "0.7.20"
bytes = "1.12.1"
zip = "9.5.1"
mimalloc = "0.1.52"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls", "http-api-client"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
