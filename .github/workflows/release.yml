name: Release

# Tags vX.Y.Z when the Cargo.toml version changes on main, then dispatches the
# Docker workflow on that tag. A tag created with GITHUB_TOKEN does not trigger
# the tag push event, but workflow_dispatch does.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag new version and publish image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 -oP '^version = "\K[0-9]+\.[0-9]+\.[0-9]+[^"]*' Cargo.toml)
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "$tag already exists, nothing to release"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
          gh workflow run docker-publish.yml --ref "$tag"
          echo "Tagged $tag and dispatched the Docker publish" >> "$GITHUB_STEP_SUMMARY"
