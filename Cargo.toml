[package]
name = "dload"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A self-hosted download manager"
repository = "https://github.com/krabhi4/dload"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.12", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
bcrypt = "0.19"
sha2 = "0.11"
hex = "0.4"
# jsonwebtoken 10 made the crypto backend pluggable; its default features
# enable no provider, so encode/decode panics at runtime. Pin the pure-Rust one.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
content_disposition = "0.4"
url = "2"
urlencoding = "2"
regex = "1"
futures = "0.3"
tokio-util = "0.7"
bytes = "1"
zip = "8"
librqbit = { version = "8", default-features = false, features = ["rust-tls", "http-api-client"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
