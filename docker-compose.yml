version: '3.8'

services:
  dload:
    image: ghcr.io/krabhi4/dload:latest
    container_name: dload
    ports:
      - "3007:8080"
    volumes:
      - ./data:/data
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cat < /dev/tcp/localhost/8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
