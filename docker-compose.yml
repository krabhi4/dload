services:
  dload:
    image: ghcr.io/krabhi4/dload:latest
    container_name: dload
    ports:
      - "3007:8080"
    volumes:
      - ./data:/data
      - ./downloads:/downloads
    environment:
      - RUST_LOG=info
      - DLOAD_JWT_SECRET=changeme-generate-a-random-secret
      # - DLOAD_CORS_ORIGIN=https://your-domain.com
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cat < /dev/tcp/localhost/8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
