services:
  dload:
    image: ghcr.io/krabhi4/dload:latest
    container_name: dload
    ports:
      - "3007:8080"
      # BitTorrent listen port for incoming peers. Required for seeding (otherwise the
      # ratio stays at 0). Must match DLOAD_BT_PORT, and forward it on your router too.
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - ./data:/data
      - ./downloads:/downloads
    environment:
      # Your host user/group, so ./data and ./downloads aren't root-owned
      # (find yours with `id -u` / `id -g`; or set them in a .env file).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - RUST_LOG=info
      - DLOAD_JWT_SECRET=changeme-generate-a-random-secret
      # BitTorrent listen port (must match the published port above).
      - DLOAD_BT_PORT=6881
      # - DLOAD_CORS_ORIGIN=https://your-domain.com
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
